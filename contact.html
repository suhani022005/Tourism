<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Tourism Management System</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #fff8f0;
      --card: #ffffff;
      --muted: #444;
      --accent: #ff6a3d;
      --accent-2: #ff5f6d;
      --glass: rgba(255,255,255,0.6);
      --shadow: 0 12px 30px rgba(16,24,40,0.08);
      --switch-bg: #dcdcdc;
      --switch-ball: #ffffff;
      --trans: 300ms;
    }

    /* DARK MODE */
    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #0d1116;
      --muted: #f1f1f1;
      --accent: #ff8a66;
      --accent-2: #ff6b7a;
      --glass: rgba(255,255,255,0.08);
      --shadow: 0 12px 30px rgba(0,0,0,0.5);
      --switch-bg: #2a2a2a;
      --switch-ball: #0a0d10;
    }

    body{
      margin:0;
      font-family:"Poppins",sans-serif;
      background:var(--bg);
      color:var(--muted);
    }

    /* HEADER */
    header{
      position:fixed;
      top:0;
      width:100%;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 6%;
      background: linear-gradient(90deg, rgba(255,95,109,0.06), rgba(255,195,113,0.04));
      backdrop-filter: blur(6px);
      transition:padding var(--trans), background var(--trans), box-shadow var(--trans);
    }

    header.scrolled{
      background:var(--card);
      box-shadow:0 6px 25px rgba(0,0,0,0.1);
      padding:10px 6%;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      color:white;
      font-family:"Playfair Display",serif;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      box-shadow:var(--shadow);
      font-weight:700;
    }

    nav{
      display:flex;
      gap:18px;
      align-items:center;
    }
    nav a{
      text-decoration:none;
      color:var(--muted);
      font-weight:500;
      padding:6px 10px;
    }
    nav a.active{
      color:var(--accent);
      font-weight:600;
    }

    /* TOGGLE FIX */
    .controls{
      display:flex;
      align-items:center;
    }

    .toggle{
      width:50px;
      height:26px;
      border-radius:50px;
      background:var(--switch-bg);
      padding:3px;
      cursor:pointer;
      display:flex;
      align-items:center;
      border:1px solid #ffffff77;
      transition:background var(--trans);
    }

    .toggle-ball{
      width:20px;
      height:20px;
      background:var(--switch-ball);
      border-radius:50%;
      transition:transform var(--trans), background var(--trans);
      box-shadow:0 0 10px #0006;
    }

    .toggle.on .toggle-ball{
      transform:translateX(24px);
    }

    /* CONTACT BOX */
    .contact-container {
      max-width: 550px;
      margin: 120px auto 50px;
      background: var(--card);
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.8s ease;
    }

    .contact-container h2 {
      text-align: center;
      color: var(--accent);
      font-family: "Playfair Display", serif;
      margin-bottom: 25px;
      font-size: 2rem;
    }

    .contact-container input,
    .contact-container textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 1rem;
      background: var(--card);
      color: var(--muted);
    }

    .contact-container input:focus,
    .contact-container textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255,120,80,0.3);
      outline: none;
    }

    .contact-container button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg,var(--accent-2),var(--accent));
      border-radius: 30px;
      border: none;
      font-weight: 600;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255,95,109,0.4);
      transition: 0.3s ease;
    }

    .contact-container button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(255,95,109,0.6);
    }

    .contact-info {
      text-align: center;
      margin-top: 25px;
      color: var(--muted);
      font-size: 1rem;
    }

    footer{
      text-align:center;
      padding:40px 0;
      color:var(--muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="site-header">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:700">Tourism Management System</div>
        <div style="font-size:12px;opacity:0.8">Explore • Plan • Travel</div>
      </div>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="packages.html">Packages</a>
      <a href="booking.html">Booking</a>
      <a href="feedback.html">Feedback</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>

    <div class="controls">
      <div class="toggle" id="theme-toggle">
        <div class="toggle-ball"></div>
      </div>
    </div>
  </header>

  <!-- CONTACT FORM -->
  <section class="contact-container">
    <h2>Contact Us</h2>

    <form onsubmit="sendContact(event)">
      <input type="text" id="contactName" placeholder="Your Name" required>
      <input type="email" id="contactEmail" placeholder="Your Email" required>
      <textarea id="contactMessage" placeholder="Your Message..." rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <p>📍 Address: Mumbai, India</p>
      <p>📧 Email: support@tms.com</p>
      <p>☎ Phone: +91 98765 43210</p>
      <p>⏱ Support: Mon - Sat (9 AM - 7 PM)</p>
    </div>
  </section>

  <footer>
    © <span id="year"></span> Tourism Management System
  </footer>

  <!-- JS -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Scroll shrink header
    const header = document.getElementById("site-header");
    window.addEventListener("scroll", () => {
      header.classList.toggle("scrolled", window.scrollY > 20);
    });

    // Dark/Light Theme
    const toggle = document.getElementById("theme-toggle");
    const key = "tms-theme";

    function applyTheme(t){
      document.documentElement.setAttribute("data-theme", t);
      toggle.classList.toggle("on", t === "dark");
    }

    applyTheme(localStorage.getItem(key) || "light");

    toggle.onclick = () => {
      let next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      applyTheme(next);
      localStorage.setItem(key, next);
    };

    // Contact form
    function sendContact(event){
      event.preventDefault();
      const name = contactName.value;
      alert(`Thank you, ${name}! Your message has been received.`);
      contactName.value = "";
      contactEmail.value = "";
      contactMessage.value = "";
    }
  </script>

</body>
</html>
