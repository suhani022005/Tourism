<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking - Tourism Management System</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #fff8f0;
      --card: #ffffff;
      --muted: #444444;
      --accent: #ff6a3d;
      --accent-2: #ff5f6d;
      --shadow: 0 12px 30px rgba(16,24,40,0.08);
    }

    :root[data-theme='dark']{
      --bg: #0f1115;
      --card: #0d1116;
      --muted: #dddddd;
      --accent: #ff8a66;
      --accent-2: #ff6b7a;
      --shadow: 0 12px 30px rgba(0,0,0,0.55);
    }

    *{box-sizing:border-box;}
    body{
      background: var(--bg);
      color: var(--muted);
      font-family: "Poppins",sans-serif;
      margin:0;
    }

    /* HEADER */
    header{
      position:fixed;
      top:0;
      width:100%;
      z-index:50;
      padding:14px 6%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: linear-gradient(90deg, rgba(255,95,109,0.06), rgba(255,195,113,0.04));
      backdrop-filter: blur(6px);
      transition:0.3s ease;
    }
    header.scrolled{
      background: var(--card);
      box-shadow: var(--shadow);
      padding:10px 6%;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:600;
    }
    .logo{
      width:44px;
      height:44px;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-family:"Playfair Display",serif;
      font-size:22px;
      box-shadow:var(--shadow);
    }

    nav a{
      margin-left:18px;
      color:var(--muted);
      text-decoration:none;
      font-weight:500;
    }
    nav a.active{color:var(--accent); font-weight:700;}

    /* Theme Toggle */
    .toggle{
      width:60px;
      height:30px;
      border-radius:50px;
      background:#ddd;
      padding:4px;
      display:flex;
      align-items:center;
      cursor:pointer;
      position:relative;
    }
    .toggle-ball{
      width:22px;
      height:22px;
      background:white;
      border-radius:50%;
      transition:0.3s;
      box-shadow:0 3px 8px rgba(0,0,0,0.2);
    }
    .toggle.on .toggle-ball{
      transform:translateX(28px);
    }

    :root[data-theme='dark'] .toggle{
      background:#222;
    }
    :root[data-theme='dark'] .toggle-ball{
      background:#000;
    }

    /* BOOKING BOX */
    .booking-container{
      max-width:520px;
      margin:130px auto 60px;
      background:var(--card);
      padding:35px 30px;
      border-radius:18px;
      box-shadow:var(--shadow);
      animation:fadeIn .8s ease;
    }

    .booking-container h2{
      text-align:center;
      color:var(--accent);
      font-family:"Playfair Display",serif;
      margin-bottom:25px;
      font-size:2rem;
    }

    .booking-container input{
      width:100%;
      padding:14px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #ccc;
      font-size:1rem;
      background:var(--card);
      color:var(--muted);
      transition:.3s;
    }

    .booking-container button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:30px;
      background:linear-gradient(90deg,var(--accent-2),var(--accent));
      color:white;
      font-size:1.1rem;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 5px 15px rgba(255,95,109,0.4);
      transition:0.3s;
    }
    .booking-container button:hover{transform:translateY(-3px);}

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(30px);}
      to{opacity:1; transform:translateY(0);}
    }

    footer{
      text-align:center;
      padding:20px;
      color:var(--muted);
    }
  </style>

  <script>
    function confirmBooking(event){
      event.preventDefault();
      let name = document.getElementById("name").value;
      let tour = document.getElementById("tour").value;
      let date = document.getElementById("date").value;
      let people = document.getElementById("people").value;

      window.location.href =
        `confirmation.html?name=${name}&tour=${tour}&date=${date}&people=${people}`;
    }

    // Autofill tour name from URL (?tour=Tour Name)
    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if(params.get("tour")){
        document.getElementById("tour").value = params.get("tour");
      }
    };
  </script>
</head>

<body>

  <!-- HEADER -->
  <header id="site-header">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:700;">Tourism Management System</div>
        <div style="font-size:12px; opacity:0.7;">Explore • Plan • Travel</div>
      </div>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="packages.html">Packages</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="toggle" id="theme-toggle">
      <div class="toggle-ball"></div>
    </div>
  </header>

  <!-- BOOKING -->
  <section class="booking-container">
    <h2>Complete Your Booking</h2>

    <form onsubmit="confirmBooking(event)">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="text" id="tour" placeholder="Tour Name" required>
      <input type="date" id="date" required>
      <input type="number" id="people" placeholder="Number of People" min="1" required>

      <button type="submit">Confirm Booking</button>
    </form>
  </section>

  <footer>
    © 2025 Tourism Management System
  </footer>

  <script>
    /* Theme toggle */
    const toggle = document.getElementById('theme-toggle');
    const storageKey = "tms-theme";

    function applyTheme(theme){
      document.documentElement.setAttribute("data-theme", theme);
      toggle.classList.toggle("on", theme === "dark");
    }

    applyTheme(localStorage.getItem(storageKey) || "light");

    toggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      applyTheme(next);
      localStorage.setItem(storageKey, next);
    });

    /* Header scroll effect */
    window.addEventListener("scroll", () => {
      const header = document.getElementById("site-header");
      if (window.scrollY > 20) header.classList.add("scrolled");
      else header.classList.remove("scrolled");
    });
  </script>

</body>
</html>
