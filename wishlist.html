<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist - Tourism Management System</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #fff8f0;
      --card: #ffffff;
      --muted: #444;
      --accent: #ff6a3d;
      --accent-2: #ff5f6d;
      --shadow: 0 12px 28px rgba(0,0,0,0.08);
      --switch-bg:#ddd;
      --switch-ball:#fff;
      --trans: 300ms;
    }

    :root[data-theme='dark']{
      --bg:#0f1115;
      --card:#0d1116;
      --muted:#e1e1e1;
      --accent:#ff8a66;
      --accent-2:#ff6b7a;
      --shadow:0 12px 30px rgba(0,0,0,0.5);
      --switch-bg:#2a2a2a;
      --switch-ball:#0a0d10;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      font-family:"Poppins",sans-serif;
      color:var(--muted);
    }

    /* ---- Header ---- */
    header{
      position:fixed;
      top:0;
      width:100%;
      z-index:60;
      padding:16px 6%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:linear-gradient(90deg,rgba(255,95,109,0.06),rgba(255,195,113,0.04));
      backdrop-filter:blur(6px);
      transition:all var(--trans);
    }
    header.scrolled{
      background:var(--card);
      box-shadow:0 6px 25px rgba(0,0,0,0.1);
      padding:10px 6%;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:44px;height:44px;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:"Playfair Display",serif;
      font-size:22px;
      border-radius:10px;
      box-shadow:var(--shadow);
    }

    nav a{
      margin-left:18px;
      color:var(--muted);
      font-weight:500;
    }
    nav a.active{
      color:var(--accent);
      font-weight:700;
    }

    .controls{
      display:flex;
      align-items:center;
    }

    /* Toggle */
    .toggle{
      width:50px;
      height:26px;
      border-radius:50px;
      background:var(--switch-bg);
      padding:3px;
      cursor:pointer;
      border:1px solid #9993;
      transition:var(--trans);
    }
    .toggle-ball{
      width:20px;height:20px;
      background:var(--switch-ball);
      border-radius:50%;
      transition:var(--trans);
    }
    .toggle.on .toggle-ball{ transform:translateX(24px) }

    /* ---- Page ---- */
    .page-title{
      margin-top:120px;
      text-align:center;
    }
    .page-title h1{
      font-family:"Playfair Display",serif;
      color:var(--accent);
      font-size:2.4rem;
    }

    /* Wishlist box */
    .wishlist-box{
      max-width:800px;
      margin:30px auto 60px;
      background:var(--card);
      padding:25px;
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .item{
      background:var(--card);
      border-radius:12px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 4px 18px rgba(0,0,0,0.08);
    }

    .item h3{
      margin:0;
      font-family:"Playfair Display",serif;
      color:var(--accent);
    }

    .item p{
      margin:6px 0 12px;
    }

    button{
      padding:10px 20px;
      border:none;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }

    .view-btn{
      background:linear-gradient(90deg,var(--accent-2),var(--accent));
      color:white;
    }

    .remove-btn{
      background:#bbb;
      margin-left:10px;
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="site-header">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:700">Tourism Management System</div>
        <div style="font-size:12px;opacity:0.8">Explore • Plan • Travel</div>
      </div>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="packages.html">Packages</a>
      <a class="active" href="wishlist.html">Wishlist</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="controls">
      <div id="theme-toggle" class="toggle">
        <div class="toggle-ball"></div>
      </div>
    </div>
  </header>

  <!-- TITLE -->
  <section class="page-title">
    <h1>Your Wishlist</h1>
    <p>All your saved tour packages in one place.</p>
  </section>

  <!-- WISHLIST CONTENT -->
  <section class="wishlist-box" id="wishlistContainer">Loading...</section>

  <script>
    const packageData = {
      1:{name:"Goa Beach Tour",price:"₹5000 • 3 Days"},
      2:{name:"Himalayan Trek",price:"₹12000 • 7 Days"},
      3:{name:"Mumbai City Tour",price:"₹3000 • 1 Day"},
      4:{name:"Rajasthan Desert Safari",price:"₹8500 • 4 Days"},
      5:{name:"Andaman Island Tour",price:"₹15000 • 6 Days"},
      6:{name:"Kerala Backwater Tour",price:"₹9000 • 3 Days"}
    };

    let wishlist = (JSON.parse(localStorage.getItem("wishlist")) || []).map(Number);

    function loadWishlist(){
      let box = document.getElementById("wishlistContainer");

      if(wishlist.length === 0){
        box.innerHTML = "<p style='text-align:center; opacity:0.7'>No items in wishlist.</p>";
        return;
      }

      let html = "";
      wishlist.forEach(id => {
        let p = packageData[id];
        if(!p) return;

        html += `
          <div class="item">
            <h3>${p.name}</h3>
            <p>${p.price}</p>
            <button class="view-btn" onclick="location.href='package-details.html?id=${id}'">View Details</button>
            <button class="remove-btn" onclick="removeItem(${id})">Remove</button>
          </div>
        `;
      });

      box.innerHTML = html;
    }

    function removeItem(id){
      wishlist = wishlist.filter(x => x !== Number(id));
      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      loadWishlist();
    }

    loadWishlist();

    /* Scroll header */
    const header = document.getElementById("site-header");
    window.addEventListener("scroll",()=>{
      header.classList.toggle("scrolled",window.scrollY>26);
    });

    /* Theme toggle */
    const toggle = document.getElementById("theme-toggle");
    const saved = localStorage.getItem("tms-theme") || "light";
    applyTheme(saved);

    function applyTheme(t){
      document.documentElement.setAttribute("data-theme", t);
      toggle.classList.toggle("on", t==="dark");
    }

    toggle.onclick = () => {
      let now = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
      applyTheme(now);
      localStorage.setItem("tms-theme", now);
    };
  </script>

</body>
</html>
