<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback - Tourism Management System</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #fff8f0;
      --card: #ffffff;
      --muted: #444;
      --accent: #ff6a3d;
      --accent-2: #ff5f6d;
      --glass: rgba(255,255,255,0.6);
      --shadow: 0 12px 30px rgba(16,24,40,0.08);
      --switch-bg: #dcdcdc;
      --switch-ball: #ffffff;
      --trans-dur: 300ms;
    }

    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #0d1116;
      --muted: #e1e1e1;
      --accent: #ff8a66;
      --accent-2: #ff6b7a;
      --shadow: 0 12px 30px rgba(0,0,0,0.55);
      --switch-bg: #2a2a2a;
      --switch-ball: #0a0d10;
    }

    *{box-sizing:border-box;}

    body {
      margin: 0;
      background: var(--bg);
      color: var(--muted);
      font-family: "Poppins", sans-serif;
    }

    /* ---------------- HEADER (Same as packages page) ---------------- */
    header{
      position:fixed;
      top:0;
      width:100%;
      z-index:50;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 6%;
      background: linear-gradient(90deg, rgba(255,95,109,0.06), rgba(255,195,113,0.04));
      backdrop-filter: blur(6px);
      transition: padding var(--trans-dur), background var(--trans-dur), box-shadow var(--trans-dur);
    }
    header.scrolled{
      background:var(--card);
      box-shadow:var(--shadow);
      padding:10px 6%;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      color:#fff;
      font-family:"Playfair Display",serif;
      font-weight:700;
      font-size:20px;
      box-shadow:var(--shadow);
    }

    nav a{
      margin-left:20px;
      font-weight:500;
      color:var(--muted);
      text-decoration:none;
    }
    nav a.active{
      color:var(--accent);
      font-weight:700;
    }

    /* Toggle – EXACT copy from packages page */
    .toggle{
      width:50px;
      height:26px;
      border-radius:50px;
      background:var(--switch-bg);
      padding:3px;
      cursor:pointer;
      display:flex;
      align-items:center;
      border:1px solid #8884;
      transition:background var(--trans-dur);
    }
    .toggle-ball{
      width:20px;
      height:20px;
      border-radius:50%;
      background:var(--switch-ball);
      transition:transform var(--trans-dur), background var(--trans-dur);
      box-shadow:0 0 10px #0005;
    }
    .toggle.on .toggle-ball{ transform:translateX(24px); }

    /* ---------------- FEEDBACK CARD ---------------- */
    .feedback-container {
      max-width: 550px;
      margin: 140px auto 60px;
      padding: 35px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.8s ease;
    }

    .feedback-container h2 {
      text-align: center;
      color: var(--accent);
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: var(--card);
      color: var(--muted);
      font-size: 1rem;
      transition: 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255,95,109,0.3);
      outline: none;
    }

    .rating-box {
      text-align: center;
      margin-bottom: 18px;
    }
    .rating-box span {
      font-size: 32px;
      cursor: pointer;
      opacity: 0.45;
      transition: 0.3s;
      padding: 3px;
    }
    .rating-box span.active {
      opacity: 1;
      transform: scale(1.25);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg,var(--accent-2),var(--accent));
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,95,109,0.4);
      transition: 0.3s;
    }
    button:hover {
      transform: translateY(-3px);
    }

    footer{
      text-align:center;
      padding:30px;
      color:var(--muted);
    }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(30px); }
      to { opacity:1; transform:translateY(0); }
    }
  </style>

  <script>
    let feedbackRating = 0;

    function setRating(el, value) {
      feedbackRating = value;
      document.querySelectorAll(".rating-box span").forEach(
        (s, i) => s.classList.toggle("active", i < value)
      );
    }

    function submitFeedback(event) {
      event.preventDefault();
      if (feedbackRating === 0) {
        alert("Please select a rating ⭐");
        return;
      }
      alert("Thank you for your valuable feedback! ⭐");
      document.getElementById("fbName").value = "";
      document.getElementById("fbEmail").value = "";
      document.getElementById("fbMessage").value = "";
      document.querySelectorAll(".rating-box span").forEach(s => s.classList.remove("active"));
      feedbackRating = 0;
    }
  </script>

</head>

<body>

<!-- ---------------- HEADER ---------------- -->
<header id="site-header">
  <div class="brand">
    <div class="logo">T</div>
    <div>
      <div style="font-weight:700">Tourism Management System</div>
      <div style="opacity:0.7; font-size:12px;">Explore • Experience • Enjoy</div>
    </div>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="packages.html">Packages</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html">Contact</a>
    <a class="active">Feedback</a>
  </nav>

  <div class="toggle" id="theme-toggle">
    <div class="toggle-ball"></div>
  </div>
</header>

<!-- ---------------- FEEDBACK MAIN ---------------- -->
<section class="feedback-container">
  <h2>Share Your Experience</h2>

  <div class="rating-box">
    <span onclick="setRating(this,1)">⭐</span>
    <span onclick="setRating(this,2)">⭐</span>
    <span onclick="setRating(this,3)">⭐</span>
    <span onclick="setRating(this,4)">⭐</span>
    <span onclick="setRating(this,5)">⭐</span>
  </div>

  <form onsubmit="submitFeedback(event)">
    <input type="text" id="fbName" placeholder="Your Name" required>
    <input type="email" id="fbEmail" placeholder="Your Email" required>
    <textarea id="fbMessage" placeholder="Write your feedback..." rows="5" required></textarea>
    <button type="submit">Submit Feedback</button>
  </form>
</section>

<footer>
  © 2025 Tourism Management System
</footer>

<script>
  /* Header Scroll */
  window.addEventListener("scroll", () => {
    document.getElementById("site-header").classList.toggle("scrolled", window.scrollY > 20);
  });

  /* Theme Toggle (EXACT same script) */
  const toggle = document.getElementById("theme-toggle");
  const key = "tms-theme";

  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    toggle.classList.toggle("on", t === "dark");
  }

  applyTheme(localStorage.getItem(key) || "light");

  toggle.onclick = () => {
    let next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(next);
    localStorage.setItem(key, next);
  };
</script>

</body>
</html>
