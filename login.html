<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tourism Management System</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fff8f0;
      --card: #ffffff;
      --muted: #444444;
      --accent: #ff6a3d;
      --accent-2: #ff5f6d;
      --shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #0d1116;
      --muted: #e2e2e2;
      --accent: #ff8a66;
      --accent-2: #ff6b7a;
      --shadow: 0 12px 30px rgba(0,0,0,0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--muted);
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 50;
      padding: 14px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(6px);
      background: linear-gradient(90deg, rgba(255,95,109,0.06), rgba(255,195,113,0.05));
      transition: 0.3s ease;
    }

    header.scrolled {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 10px 6%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      font-family: "Playfair Display", serif;
      font-size: 22px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--shadow);
    }

    nav a {
      margin-left: 18px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }

    nav a.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* THEME TOGGLE */
    .toggle {
      width: 60px;
      height: 30px;
      background: #ddd;
      border-radius: 50px;
      display: flex;
      padding: 4px;
      cursor: pointer;
      align-items: center;
    }

    .toggle-ball {
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .toggle.on .toggle-ball {
      transform: translateX(28px);
    }

    :root[data-theme='dark'] .toggle {
      background: #222;
    }

    :root[data-theme='dark'] .toggle-ball {
      background: black;
    }

    /* LOGIN CARD */
    .login-box {
      max-width: 450px;
      margin: 130px auto 60px;
      padding: 35px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.8s ease;
    }

    .login-box h2 {
      text-align: center;
      font-size: 2rem;
      font-family: "Playfair Display", serif;
      color: var(--accent);
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: var(--card);
      color: var(--muted);
    }

    .login-box input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(255,95,109,0.4);
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(255,95,109,0.4);
      transition: 0.3s;
    }

    .login-box button:hover {
      transform: translateY(-3px);
    }

    .login-box p {
      text-align: center;
      font-size: 0.95rem;
      margin-top: 15px;
    }

    .login-box a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 25px;
      color: var(--muted);
    }
  </style>
</head>

<body>

<header id="site-header">
  <div class="brand">
    <div class="logo">T</div>
    <div>
      <div style="font-weight:700;">Tourism Management System</div>
      <div style="opacity:0.7; font-size:12px;">Explore • Plan • Travel</div>
    </div>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="toggle" id="theme-toggle">
    <div class="toggle-ball"></div>
  </div>
</header>

<section class="login-box">
  <h2>User Login</h2>

  <form onsubmit="return userLogin(event)">
    <input type="email" id="loginEmail" placeholder="Enter your email" required>
    <input type="password" id="loginPassword" placeholder="Enter your password" required>

    <button type="submit">Login</button>

    <p>Don’t have an account?
      <a href="register.html">Register here</a>
    </p>
  </form>
</section>

<footer>
  © 2025 Tourism Management System
</footer>

<script>
  /* THEME SYSTEM */
  const toggle = document.getElementById("theme-toggle");
  const storageKey = "tms-theme";

  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    toggle.classList.toggle("on", theme === "dark");
  }

  applyTheme(localStorage.getItem(storageKey) || "light");

  toggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "light" ? "dark" : "light";
    applyTheme(next);
    localStorage.setItem(storageKey, next);
  });

  /* HEADER SCROLL */
  window.addEventListener("scroll", () => {
    const header = document.getElementById('site-header');
    header.classList.toggle("scrolled", window.scrollY > 20);
  });
</script>

<script src="js/script.js"></script>
</body>
</html>
