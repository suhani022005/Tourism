<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Package - Tourism Management System</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1>Add New Tour Package</h1>
    <nav>
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="#" onclick="logoutAdmin()">Logout</a>
    </nav>
  </header>

  <section class="booking-form">
    <form onsubmit="return addPackage(event)">
      <h2>New Package Details</h2>
      <input type="text" id="packageName" placeholder="Package Name" required>
      <input type="text" id="packagePrice" placeholder="Price (₹)" required>
      <input type="text" id="packageDuration" placeholder="Duration (e.g., 5 Days)" required>
      <input type="text" id="packageImage" placeholder="Image File Name (e.g., beach.jpg)" required>
      <button type="submit">Add Package</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Tourism Management System</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
